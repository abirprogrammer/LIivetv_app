
  name: fitforge
  description: "A professional fitness and workout app"
  publish_to: 'none'

  version: 1.0.0+1

  environment:
    sdk: ^3.13.0

  dependencies:
    flutter:
      sdk: flutter

    cupertino_icons: ^1.0.8

    # Google Fonts
    google_fonts: ^8.2.1

    # State Management
    provider: ^6.1.2


    # GetX
    get: ^4.7.2

      # Local Storage
    get_storage: ^2.1.1

    # HTTP/API
    dio: ^5.9.0

    # Local Storage
    shared_preferences: ^2.5.3

    # Network Images Cache
    cached_network_image: ^3.4.1

    # Banner / Image Slider
    carousel_slider: ^5.1.1

    # Workout Animations
    lottie: ^3.3.1

    # Date & Time formatting
    intl: ^0.20.2

    # Share App
    share_plus: ^11.1.0

    # Open external links
    url_launcher: ^6.3.2

    # Image Picker
    image_picker: ^1.1.2

    # Permission handling
    permission_handler: ^12.0.1

    # Connectivity checking
    connectivity_plus: ^7.0.0

    # UUID generation
    uuid: ^4.5.1

    # Secure local storage
    flutter_secure_storage: ^9.2.4

  dev_dependencies:
    flutter_test:
      sdk: flutter

    flutter_lints: ^6.0.0

    # App Icon Generator
    flutter_launcher_icons: ^0.14.4

  # =====================================================
  # FLUTTER LAUNCHER ICON
  # =====================================================

  flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/images/trainer.png"

    # Android adaptive icon
    adaptive_icon_background: "#111111"
    adaptive_icon_foreground: "assets/images/trainer.png"

    # Remove transparency from iOS icon
    remove_alpha_ios: true

  # =====================================================
  # FLUTTER
  # =====================================================

  flutter:
    uses-material-design: true

    assets:
      - images/
      - assets/
      - assets/images/
      - assets/animations/
      - assets/icons/

