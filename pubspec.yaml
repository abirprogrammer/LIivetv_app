name: livetv
description: "LiveTv - Live IPTV & TV Streaming Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  video_player: ^2.14.1
  chewie: ^1.17.2
  shared_preferences: ^2.5.6
  provider: ^6.1.5+1
  cached_network_image: ^4.0.4
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App icon generator
  flutter_launcher_icons: ^0.14.4

# ==============================
# APP ICON CONFIGURATION
# ==============================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/videostream.png"

# ==============================
# FLUTTER
# ==============================
flutter:
  uses-material-design: true

  # App images/assets
  assets:
    - assets/images/